name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore XInputEmulator.sln
      - run: dotnet publish XInputEmulator.sln -c Release -o ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: XInputEmulator-build
          path: ./publish
